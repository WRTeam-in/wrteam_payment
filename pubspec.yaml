name: wrteam_payment
description: "Gateway-agnostic payment monorepo for WRTeam products: one shared contract, a plugin per gateway, no bundled UI."
version: 0.1.0
homepage:
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

workspace:
  - packages/payment_core
  - packages/payment_stripe
  - packages/payment_razorpay
  - packages/payment_phonepe
  - packages/payment_webview_core
  - packages/payment_paystack
  - packages/payment_flutterwave
  - packages/payment_paytabs
  - packages/payment_dpo
  - packages/payment_paypal

dependencies:
  flutter:
    sdk: flutter
  payment_core:
    path: packages/payment_core
  payment_webview_core:
    path: packages/payment_webview_core
  payment_stripe:
    path: packages/payment_stripe
  payment_razorpay:
    path: packages/payment_razorpay
  payment_phonepe:
    path: packages/payment_phonepe
  payment_paystack:
    path: packages/payment_paystack
  payment_flutterwave:
    path: packages/payment_flutterwave
  payment_paytabs:
    path: packages/payment_paytabs
  payment_dpo:
    path: packages/payment_dpo
  payment_paypal:
    path: packages/payment_paypal

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  melos: ^8.2.2

